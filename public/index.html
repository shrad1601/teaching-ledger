<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teaching Ledger</title>
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0B3F52">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ledger">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --ink:#10252B;
    --ink-soft:#567078;
    --paper:#E6EFF1;
    --surface:rgba(255,255,255,0.66);
    --surface-solid:#FFFFFF;
    --surface-2:rgba(255,255,255,0.85);
    --line:rgba(16,37,43,0.12);
    --accent:#13798A;
    --accent-strong:#0B3F52;
    --accent-glow:rgba(19,121,138,0.28);
    --accent-ink:#E2F2F4;
    --grad:linear-gradient(135deg, #0B3F52, #13798A);
    --grad-bar:linear-gradient(180deg, #13798A, #0B3F52);
    --rose:#C06B3F;
    --rose-glow:rgba(192,107,63,0.24);
    --rose-ink:#F8E9DE;
    --danger:#B4483A;
    --danger-ink:#FBEDEA;
    --on-gradient:#FFFFFF;
    --org-mindstretcher:#5A6FC4;
    --org-ottodot:#C97A46;
    --org-mastermaths:#3F9E8F;
    --org-bluetree:#3F8FB0;
    --org-primeplus:#B08A3A;
    --shadow:0 1px 2px rgba(16,37,43,0.07), 0 14px 34px rgba(11,63,82,0.13);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#E3EFF1;
      --ink-soft:#8BA6AD;
      --paper:#06131A;
      --surface:rgba(16,38,47,0.58);
      --surface-solid:#0D1F27;
      --surface-2:rgba(22,50,61,0.62);
      --line:rgba(255,255,255,0.09);
      --accent:#3AAFBD;
      --accent-strong:#135A69;
      --accent-glow:rgba(58,175,189,0.30);
      --accent-ink:#0C2A31;
    --grad:linear-gradient(135deg, #0D3541, #18707F);
    --grad-bar:linear-gradient(180deg, #2A9BAA, #135A69);
      --rose:#E9A87F;
      --rose-glow:rgba(233,168,127,0.25);
      --rose-ink:#3A2216;
      --danger:#E0796D;
      --danger-ink:#3A1714;
      --shadow:0 1px 2px rgba(0,0,0,0.5), 0 16px 44px rgba(20,120,140,0.22);
    }
  }
  :root[data-theme="dark"]{
    --ink:#E3EFF1;
    --ink-soft:#8BA6AD;
    --paper:#06131A;
    --surface:rgba(16,38,47,0.58);
    --surface-solid:#0D1F27;
    --surface-2:rgba(22,50,61,0.62);
    --line:rgba(255,255,255,0.09);
    --accent:#3AAFBD;
    --accent-strong:#135A69;
    --accent-glow:rgba(58,175,189,0.30);
    --accent-ink:#0C2A31;
    --grad:linear-gradient(135deg, #0D3541, #18707F);
    --grad-bar:linear-gradient(180deg, #2A9BAA, #135A69);
    --rose:#E9A87F;
    --rose-glow:rgba(233,168,127,0.25);
    --rose-ink:#3A2216;
    --danger:#E0796D;
    --danger-ink:#3A1714;
    --shadow:0 1px 2px rgba(0,0,0,0.5), 0 16px 44px rgba(20,120,140,0.22);
  }

  *{ box-sizing:border-box; }
  html{ color-scheme:light dark; }
  body{
    margin:0;
    background:
      radial-gradient(620px circle at 12% -8%, var(--accent-glow), transparent 60%),
      radial-gradient(520px circle at 108% 6%, var(--rose-glow), transparent 55%),
      radial-gradient(700px circle at 50% 120%, var(--accent-glow), transparent 60%),
      var(--paper);
    background-attachment:fixed;
    color:var(--ink);
    font-family:'Manrope', ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3{ text-wrap:balance; font-weight:700; }
  .display{
    font-family:'Unbounded', 'Manrope', sans-serif;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  .mono{
    font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace;
    font-variant-numeric: tabular-nums;
  }
  button{ font-family:inherit; }
  button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; transition-duration:0.01ms !important; }
  }

  /* ---- passcode gate ---- */
  #gate{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .gate-card{
    width:100%; max-width:320px;
    background:var(--surface); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    border:1px solid var(--line); border-radius:20px; padding:28px 24px; box-shadow:var(--shadow);
    text-align:center;
  }
  .gate-card h1{
    font-family:'Unbounded', sans-serif; font-size:18px; margin:0 0 6px;
    background:linear-gradient(120deg, var(--accent-strong), var(--accent) 60%, var(--rose));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .gate-card p{ font-size:12.5px; color:var(--ink-soft); margin:0 0 18px; }
  .gate-card input{
    width:100%; font-family:'IBM Plex Mono', monospace; font-size:20px; letter-spacing:0.3em; text-align:center;
    padding:13px; border-radius:12px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink);
    margin-bottom:14px;
  }
  .gate-card button{
    width:100%; background:var(--grad);
    color:var(--on-gradient); border:none; border-radius:999px; padding:13px; font-size:14px; font-weight:700; cursor:pointer;
    box-shadow:0 10px 28px var(--accent-glow);
  }
  .gate-error{ color:var(--danger); font-size:12px; margin-top:10px; }

  #app{
    max-width:560px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  header.topbar{
    position:sticky; top:10px; z-index:5;
    margin:10px 14px 0;
    background:var(--surface);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border:1px solid var(--line);
    border-radius:20px;
    padding:14px 18px;
    box-shadow:var(--shadow);
  }
  header.topbar .brandrow{ display:flex; align-items:center; justify-content:space-between; }
  header.topbar h1{
    font-family:'Unbounded', sans-serif;
    font-weight:700;
    font-size:16.5px; margin:0;
    letter-spacing:-0.01em;
    background:linear-gradient(120deg, var(--accent-strong), var(--accent) 60%, var(--rose));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  header.topbar .section-label{
    margin-top:7px;
    font-size:10.5px;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:0.14em;
    font-weight:600;
  }
  .theme-toggle{
    width:34px; height:34px; border-radius:50%; border:1px solid var(--line);
    background:var(--surface-2); color:var(--accent); font-size:15px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; flex:0 0 auto;
  }

  main{
    flex:1;
    padding:20px 14px 118px;
    display:flex;
    flex-direction:column;
    gap:24px;
  }

  /* ---- Dashboard ---- */
  .period-scroller{
    display:flex;
    gap:8px;
  }
  .period-card{
    flex:1 1 0;
    min-width:0;
    background:var(--surface);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border:1px solid var(--line);
    border-radius:18px;
    padding:13px 10px;
    box-shadow:var(--shadow);
  }
  .period-card .p-label{
    font-size:9.5px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--ink-soft);
    margin-bottom:8px;
    font-weight:600;
    white-space:nowrap;
  }
  .period-card .p-combined{
    font-size:15px;
    margin-bottom:10px;
    line-height:1.05;
    white-space:nowrap;
  }
  .p-row{
    display:flex; flex-direction:column; align-items:flex-start; gap:1px;
    font-size:11px; padding:5px 0;
    border-top:1px solid var(--line);
  }
  .p-row:first-of-type{ border-top:none; padding-top:0; }
  .p-row .k{ display:flex; align-items:center; gap:5px; color:var(--ink-soft); font-weight:500; font-size:10px; }
  .upnext{
    border-radius:20px; padding:16px 18px; cursor:pointer;
    color:var(--on-gradient);
    background:var(--grad);
    box-shadow:var(--shadow);
  }
  .upnext .u-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.12em; font-weight:600; opacity:0.8; display:flex; justify-content:space-between; }
  .upnext .u-title{ font-size:18px; font-weight:800; margin:6px 0 3px; display:flex; align-items:center; gap:8px; }
  .upnext .u-title .u-dot{ width:9px; height:9px; border-radius:50%; background:#fff; flex:0 0 auto; }
  .upnext .u-sub{ font-size:12.5px; opacity:0.9; }
  .upnext.empty{ cursor:default; background:var(--surface); color:var(--ink-soft); border:1px solid var(--line); box-shadow:var(--shadow); font-size:13px; }
  .dash{ display:flex; flex-direction:column; gap:20px; }
  .dash-col{ display:contents; }
  .dash .upnext{ order:1; }
  .dash .period-scroller{ order:2; }
  .dash .quick-card{ order:3; }
  .dash .bd-card{ order:4; }
  .dash .trend-card{ order:5; }
  .dash .comingup-card{ order:6; }
  .quick-card .quickgrid{ grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:8px; }
  .quick-card .quickbtn{ flex-direction:row; justify-content:flex-start; gap:9px; padding:10px; text-align:left; }
  .quick-card .quickbtn .swatch{ flex:0 0 auto; width:16px; height:16px; border-radius:5px; }
  @media (min-width:560px){
    #app.wide{ max-width:1280px; }
    #app.wide main{ padding:12px 16px 86px; gap:0; }
    #app.wide header.topbar{ padding:10px 18px; }
    #app.wide header.topbar .section-label{ margin-top:3px; }
    .dash .upnext{ padding:13px 16px; }
    .dash .upnext .u-title{ margin:4px 0 2px; }
    .dash .p-row{ padding:3px 0; }
    .dash .breakdown-row{ padding:8px 0; }
    .dash .owed-footer{ padding:8px 12px; white-space:nowrap; }
    .dash .period-card .p-combined{ margin-bottom:8px; }
    .dash .period-card{ padding-top:12px; padding-bottom:10px; }
    .dash{
      display:grid; gap:14px; align-items:start;
      grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);
      grid-template-rows:auto 1fr;
      grid-template-areas:"a b" "a c";
    }
    .dash-col{ display:flex; flex-direction:column; gap:14px; min-width:0; }
    .dash-col.col-a{ grid-area:a; } .dash-col.col-b{ grid-area:b; } .dash-col.col-c{ grid-area:c; }
    .dash .card{ padding:16px; }
    .dash .card h2{ margin-bottom:10px; }
    .period-card{ padding:14px 10px; }
    .period-card .p-combined{ font-size:15px; }
    .p-row{ font-size:12px; } .p-row .k{ font-size:10.5px; }
  }
  @media (min-width:1000px){
    .dash{
      grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) minmax(0,0.85fr);
      grid-template-rows:auto;
      grid-template-areas:"a b c";
    }
    .quick-card .quickgrid{ grid-template-columns:repeat(2,minmax(0,1fr)); }
  }
  @media (min-width:1300px){
    .period-card{ padding:14px 14px; }
    .period-card .p-combined{ font-size:20px; }
  }
  .cu-row{ display:flex; align-items:center; gap:10px; padding:7px 0; border-top:1px solid var(--line); cursor:pointer; font-size:13px; }
  .cu-row:first-of-type{ border-top:none; padding-top:0; }
  .cu-when{ flex:0 0 auto; width:118px; white-space:nowrap; font-size:11.5px; color:var(--ink-soft); line-height:1.3; }
  .cu-org{ flex:1; min-width:0; display:flex; align-items:center; gap:7px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cu-amt{ flex:0 0 auto; font-size:12.5px; font-weight:700; color:var(--rose); }
  .trend{ display:flex; align-items:flex-end; gap:8px; height:120px; padding-top:4px; }
  .trend-col{ flex:1; min-width:0; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:5px; cursor:pointer; border:none; background:transparent; padding:0; color:var(--ink); }
  .trend-amt{ font-size:10.5px; color:var(--ink-soft); white-space:nowrap; }
  .trend-bar{ width:100%; max-width:44px; border-radius:8px 8px 4px 4px; overflow:hidden; display:flex; flex-direction:column; background:var(--line); min-height:3px; }
  .trend-bar .proj{ background:var(--rose); opacity:0.75; }
  .trend-bar .earn{ background:var(--grad-bar); }
  .trend-lbl{ font-size:11px; font-weight:700; color:var(--ink-soft); }
  .trend-col.sel .trend-lbl{ color:var(--accent); }
  .sharebar{ display:flex; height:8px; border-radius:4px; overflow:hidden; margin:2px 0 12px; background:var(--line); }
  .dot{ width:7px; height:7px; border-radius:50%; display:inline-block; flex:0 0 auto; }
  .dot.earned{ background:var(--accent); box-shadow:0 0 8px var(--accent-glow); }
  .dot.projected{ background:var(--rose); box-shadow:0 0 8px var(--rose-glow); }

  .card{
    background:var(--surface);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border:1px solid var(--line);
    border-radius:20px;
    padding:19px;
    box-shadow:var(--shadow);
  }
  .card h2{ font-size:14.5px; margin:0 0 14px; letter-spacing:0.01em; font-family:'Manrope'; font-weight:700; }

  .seg{
    display:flex; gap:5px; background:var(--paper); padding:4px; border-radius:999px; border:1px solid var(--line);
  }
  .seg button{
    flex:1; border:none; background:transparent; padding:8px 0; font-size:12.5px; font-weight:700;
    color:var(--ink-soft); border-radius:999px; cursor:pointer;
  }
  .seg button.active{ background:var(--grad); color:var(--on-gradient); }

  .breakdown-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:11px 0; border-bottom:1px solid var(--line);
  }
  .breakdown-row:last-child{ border-bottom:none; }
  .breakdown-row .org{ display:flex; align-items:center; gap:9px; font-size:13.5px; font-weight:600; }
  .breakdown-row .amounts{ text-align:right; font-size:13px; }
  .breakdown-row .amounts .combined{ font-weight:700; }
  .breakdown-row .amounts .split{ color:var(--ink-soft); font-size:11px; }
  .empty-note{ color:var(--ink-soft); font-size:13px; padding:8px 0; }

  /* ---- quick add ---- */
  .quickgrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .quickbtn{
    display:flex; flex-direction:column; align-items:center; gap:9px;
    background:var(--surface-2); border:1px solid var(--line); border-radius:16px;
    padding:16px 6px; cursor:pointer; font-size:12px; font-weight:700; color:var(--ink);
  }
  .quickbtn .swatch{ width:20px; height:20px; border-radius:7px; box-shadow:0 0 10px currentColor; }
  .quickbtn:active{ transform:translateY(1px); }
  .quickbtn.new{ background:transparent; border:1.5px dashed var(--line); color:var(--ink-soft); }
  .quickbtn.new .swatch{ display:flex; align-items:center; justify-content:center; background:transparent; box-shadow:none; color:var(--ink-soft); font-size:16px; font-weight:700; }

  /* ---- forms ---- */
  .field{ display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
  .field label{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.09em; color:var(--ink-soft); font-weight:700; }
  .field input, .field select{
    font-family:'IBM Plex Mono', monospace;
    font-size:14px;
    padding:11px 13px;
    border-radius:12px;
    border:1px solid var(--line);
    background:var(--surface-2);
    color:var(--ink);
  }
  .choice-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .choice-row button{
    flex:1; min-width:90px;
    border:1px solid var(--line); background:var(--surface-2); color:var(--ink);
    padding:11px 8px; border-radius:12px; font-size:13px; font-weight:700; cursor:pointer;
  }
  .choice-row button.active{ background:var(--grad); border-color:transparent; color:var(--on-gradient); }
  .toggle-row{ display:flex; align-items:center; justify-content:space-between; padding:4px 0 16px; }
  .toggle-row .t-label{ font-size:13.5px; font-weight:600; }
  .switch{ position:relative; width:42px; height:24px; border-radius:12px; background:var(--line); border:none; cursor:pointer; }
  .switch.on{ background:var(--grad); }
  .switch .knob{ position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:var(--surface-solid); transition:transform .15s ease; }
  .switch.on .knob{ transform:translateX(18px); }

  .rate-preview{
    background:var(--accent-ink); border:1px solid var(--line); color:var(--accent);
    border-radius:14px; padding:12px 15px; font-size:13px; margin-bottom:16px; display:flex; justify-content:space-between; align-items:center; font-weight:600;
  }
  .save-btn{
    width:100%; background:var(--grad);
    color:var(--on-gradient); border:none; border-radius:999px;
    padding:15px; font-size:14.5px; font-weight:700; cursor:pointer;
    box-shadow:0 10px 28px var(--accent-glow);
  }
  .save-btn:active{ transform:translateY(1px); }
  .back-link{ background:none; border:none; color:var(--ink-soft); font-size:13px; cursor:pointer; padding:0 0 6px; display:flex; align-items:center; gap:4px; font-weight:600; }

  .comingsoon{
    border:1px dashed var(--line); border-radius:16px; padding:15px; color:var(--ink-soft); font-size:13px; text-align:center;
  }

  /* ---- history/trash ---- */
  .filter-row{ display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; }
  .chip{
    flex:0 0 auto; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-soft);
    padding:7px 13px; border-radius:999px; font-size:12px; font-weight:700; cursor:pointer; display:flex; align-items:center; gap:6px;
  }
  .chip.active{ background:var(--grad); color:var(--on-gradient); border-color:transparent; }

  .class-list{ display:flex; flex-direction:column; gap:8px; }
  .class-item{
    background:var(--surface); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border:1px solid var(--line); border-radius:16px; padding:13px 15px;
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    box-shadow:var(--shadow);
  }
  .class-item .left{ display:flex; flex-direction:column; gap:3px; min-width:0; }
  .class-item .top-line{ display:flex; align-items:center; gap:7px; font-size:13.5px; font-weight:700; }
  .class-item .sub-line{ font-size:11.5px; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .class-item .right{ display:flex; align-items:center; gap:10px; flex:0 0 auto; }
  .class-item .income{ font-size:14px; font-weight:700; }
  .class-item .income.future{ color:var(--rose); }
  .class-item .income.past{ color:var(--accent); }
  .icon-btn{
    border:none; background:transparent; color:var(--ink-soft); cursor:pointer; font-size:16px; padding:4px 6px; border-radius:8px;
  }
  .icon-btn:hover{ background:var(--surface-2); }
  .icon-btn.danger:hover{ background:var(--danger-ink); color:var(--danger); }
  .tag-badge{
    font-size:9.5px; text-transform:uppercase; letter-spacing:0.04em; font-weight:700;
    background:var(--surface-2); color:var(--ink-soft); border-radius:6px; padding:2px 6px;
  }

  /* ---- sync log ---- */
  .change-badge{
    font-size:9.5px; text-transform:uppercase; letter-spacing:0.04em; font-weight:700;
    border-radius:6px; padding:2px 6px; display:inline-block;
  }
  .change-badge.added, .change-badge.restored{ background:var(--accent-ink); color:var(--accent); }
  .change-badge.updated{ background:var(--rose-ink); color:var(--rose); }
  .change-badge.removed{ background:var(--danger-ink); color:var(--danger); }
  .sync-run-card{
    background:var(--surface); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    border:1px solid var(--line); border-radius:20px; padding:16px; box-shadow:var(--shadow);
  }
  .sync-run-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:2px; }
  .sync-run-head .org{ display:flex; align-items:center; gap:8px; font-size:13.5px; font-weight:700; }
  .sync-run-head .when{ font-size:11px; color:var(--ink-soft); }
  .sync-run-summary{ font-size:12px; color:var(--ink-soft); margin-bottom:10px; }

<script>
(function(){
  "use strict";

  if ("serviceWorker" in navigator){
    navigator.serviceWorker.register("/sw.js").catch(function(){});
  }

  // ---------------- passcode gate ----------------
  var PASSCODE_HASH = "03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4";
  async function sha256Hex(str){
    var enc = new TextEncoder().encode(str);
    var buf = await crypto.subtle.digest("SHA-256", enc);
    return Array.from(new Uint8Array(buf)).map(function(b){ return b.toString(16).padStart(2,"0"); }).join("");
  }
  function unlockApp(){
    document.getElementById("gate").hidden = true;
    document.getElementById("app").hidden = false;
    initDb();
    renderAll();
  }
  document.getElementById("gateForm").addEventListener("submit", async function(e){
    e.preventDefault();
    var val = document.getElementById("gateInput").value;
    var hash = await sha256Hex(val);
    if (hash === PASSCODE_HASH){
      try{ localStorage.setItem("ledgerUnlocked", "1"); }catch(err){}
      document.getElementById("gateError").hidden = true;
      unlockApp();
    } else {
      document.getElementById("gateError").hidden = false;
    }
  });
  (function checkRemembered(){
    var already = false;
    try{ already = localStorage.getItem("ledgerUnlocked") === "1"; }catch(err){}
    if (already) unlockApp();
  })();

  // ---------------- Rate constants ----------------
  var MASTERMATHS_RATE = 50;

  var BLUETREE_BRACKETS = {
    primary:   [{max:9,  rate:40}, {max:15, rate:45}],
    secondary: [{max:10, rate:50}]
  };
  function bluetreeRate(level, students){
    var brackets = BLUETREE_BRACKETS[level];
    for (var i=0;i<brackets.length;i++){ if (students <= brackets[i].max) return brackets[i].rate; }
    return brackets[brackets.length-1].rate;
  }

  var PRIMEPLUS_RATES = { "1-1":40, "pri":50, "sec":60 };
  var PRIMEPLUS_LABELS = { "1-1":"1-to-1", "pri":"Primary group", "sec":"Secondary group" };

  // Reserved for the Mind Stretcher integration (Dash sync, phase 2).
  // Gross hourly rates, index 0 = class size 1 ... index 19 = size 20 (clamped above).
  var MINDSTRETCHER_RATES = {
    preprimary: {
      weekday:[20,21,22,32,33,34,37,38,39,40,41,44,46,48,50,55,58,61,64,67],
      weekend:[25,26,27,38,39,40,43,44,45,46,47,49,51,53,55,60,63,66,69,72]
    },
    p1_p4: {
      weekday:[24,25,26,29,30,31,36,37,38,39,40,45,47,49,51,58,61,64,67,73],
      weekend:[27,28,29,32,33,34,38,39,40,41,42,49,51,53,55,62,66,70,74,78]
    },
    p5_p6: {
      weekday:[27,28,29,34,35,36,40,41,42,43,44,50,52,54,56,63,66,69,72,75],
      weekend:[30,31,32,37,38,39,43,44,45,46,47,54,56,58,60,67,71,75,79,83]
    },
    p5_p6_writing: {
      weekday:[30,31,32,37,38,39,43,44,45,46,47,54,56,58,60,66,69,72,75,78],
      weekend:[33,34,35,40,41,42,48,49,50,51,52,59,61,63,65,72,76,80,84,88]
    },
    secondary: {
      weekday:[30,31,32,37,38,39,44,45,46,47,48,55,57,59,61,68,72,76,80,84],
      weekend:[35,36,37,42,43,44,49,51,52,53,54,60,62,64,66,73,77,81,85,89]
    }
  };

  var MINDSTRETCHER_LEVELS = [
    {key:"preprimary", label:"Pre-Primary"},
    {key:"p1_p4", label:"P1–P4"},
    {key:"p5_p6", label:"P5–P6"},
    {key:"p5_p6_writing", label:"P5–P6 Writing"},
    {key:"secondary", label:"Secondary"}
  ];
  function isWeekendDate(dateStr){
    if (!dateStr) return false;
    var idx = weekdayIdx(dateStr);
    return idx===5 || idx===6;
  }
  function mindstretcherRate(level, weekend, size){
    var table = MINDSTRETCHER_RATES[level];
    if (!table) return 0;
    var arr = weekend ? table.weekend : table.weekday;
    var idx = Math.min(Math.max(Number(size)||1,1),20) - 1;
    return arr[idx];
  }

  var ORG_META = {
    mindstretcher: {label:"Mind Stretcher", color:"var(--org-mindstretcher)"},
    ottodot:       {label:"Ottodot",        color:"var(--org-ottodot)"},
    mastermaths:   {label:"Mastermaths",    color:"var(--org-mastermaths)"},
    bluetree:      {label:"Bluetree",       color:"var(--org-bluetree)"},
    primeplus:     {label:"PrimePlus",      color:"var(--org-primeplus)"}
  };
  var ORG_ORDER = ["mindstretcher","ottodot","mastermaths","bluetree","primeplus"];

  // ---------------- user-added tuition centres ----------------
  // Flat-hourly-rate organisations added at runtime, stored in the "orgs" collection.
  // Looked up alongside the built-in ORG_META/ORG_ORDER everywhere an org is rendered.
  function findCustomOrg(id){
    return customOrgs.find(function(o){ return o.id===id; }) || null;
  }
  function orgMeta(key){
    if (ORG_META[key]) return ORG_META[key];
    var c = findCustomOrg(key);
    if (c) return { label: c.label, color: c.color };
    return { label: key, color: "var(--ink-soft)" };
  }
  function allOrgKeys(){
    return ORG_ORDER.concat(customOrgs.map(function(o){ return o.id; }));
  }
  var NEW_ORG_PALETTE = ["#7C8FD6","#C97A46","#3F9E8F","#3F8FB0","#B08A3A","#B679DE","#5A9E6F","#C45C6A"];
  function nextOrgColor(){
    return NEW_ORG_PALETTE[customOrgs.length % NEW_ORG_PALETTE.length];
  }

  // ---------------- org colors (customizable) ----------------
  var DEFAULT_ORG_COLORS = {
    mindstretcher:"#5A6FC4", ottodot:"#C97A46", mastermaths:"#3F9E8F", bluetree:"#3F8FB0", primeplus:"#B08A3A"
  };
  var orgColors = Object.assign({}, DEFAULT_ORG_COLORS);
  function applyOrgColors(){
    ORG_ORDER.forEach(function(o){ document.documentElement.style.setProperty("--org-"+o, orgColors[o]); });
  }
  async function saveOrgColor(org, hex){
    orgColors[org] = hex;
    applyOrgColors();
    if (db) await db.doc("settings/colors").set(orgColors);
  }
  async function resetOrgColors(){
    orgColors = Object.assign({}, DEFAULT_ORG_COLORS);
    applyOrgColors();
    if (db) await db.doc("settings/colors").set(orgColors);
    renderSettings();
  }

  // ---------------- theme ----------------
  function currentTheme(){
    var attr = document.documentElement.getAttribute("data-theme");
    if (attr) return attr;
    return (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  }
  function updateThemeIcon(){
    document.getElementById("themeToggle").textContent = currentTheme()==="dark" ? "☀" : "☾";
  }
  function setTheme(t){
    document.documentElement.setAttribute("data-theme", t);
    try{ localStorage.setItem("ledgerTheme", t); }catch(e){}
    updateThemeIcon();
  }
  document.getElementById("themeToggle").addEventListener("click", function(){
    setTheme(currentTheme()==="dark" ? "light" : "dark");
  });
  updateThemeIcon();
  document.getElementById("settingsBtn").addEventListener("click", function(){
    currentTab = "settings";
    renderAll();
  });

  // ---------------- date helpers ----------------
  function pad(n){ return String(n).padStart(2,"0"); }
  function toDateStr(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function todayStr(){ return toDateStr(new Date()); }
  function addDays(dateStr, n){
    var parts = dateStr.split("-").map(Number);
    var d = new Date(parts[0], parts[1]-1, parts[2]);
    d.setDate(d.getDate()+n);
    return toDateStr(d);
  }
  function weekdayIdx(dateStr){ // 0=Mon..6=Sun
    var parts = dateStr.split("-").map(Number);
    var d = new Date(parts[0], parts[1]-1, parts[2]);
    return (d.getDay()+6)%7;
  }
  var WEEKDAY_NAMES = ["mon","tue","wed","thu","fri","sat","sun"];
  var WEEKDAY_LABELS = ["Mo","Tu","We","Th","Fr","Sa","Su"];
  function mondayOf(dateStr){ return addDays(dateStr, -weekdayIdx(dateStr)); }
  function sundayOf(dateStr){ return addDays(dateStr, 6-weekdayIdx(dateStr)); }
  function monthRange(dateStr){
    var parts = dateStr.split("-").map(Number);
    var first = parts[0]+"-"+pad(parts[1])+"-01";
    var lastDate = new Date(parts[0], parts[1], 0).getDate();
    var last = parts[0]+"-"+pad(parts[1])+"-"+pad(lastDate);
    return [first,last];
  }
  function fmtDate(dateStr){
    var parts = dateStr.split("-").map(Number);
    var d = new Date(parts[0], parts[1]-1, parts[2]);
    return d.toLocaleDateString("en-SG",{day:"2-digit",month:"short",year:"numeric"});
  }
  function fmtMoney(n){
    var sign = n<0 ? "-" : "";
    return sign + "$" + Math.abs(n).toLocaleString("en-SG",{minimumFractionDigits:2,maximumFractionDigits:2});
  }
  function formatTime12h(t){
    if (!t) return "";
    var parts = t.split(":").map(Number);
    var h = parts[0], m = parts[1]||0;
    var ap = h>=12 ? "pm" : "am";
    var h12 = h%12; if (h12===0) h12=12;
    return h12 + (m ? ":"+String(m).padStart(2,"0") : "") + ap;
  }
  var OTTODOT_SUBJECT_LABELS = { SCI:"Sci", MATH:"Math", ENG:"Eng" };
  function parseOttodotLabel(raw){
    if (!raw) return null;
    var m = raw.match(/^([A-Za-z]+\d+)\d{4}-([A-Za-z]+)-/);
    if (!m) return null;
    var level = m[1].toUpperCase();
    var subjCode = m[2].toUpperCase();
    var subj = OTTODOT_SUBJECT_LABELS[subjCode] || (subjCode.charAt(0)+subjCode.slice(1).toLowerCase());
    return level + " " + subj;
  }
  function classTypeLabel(c){
    if (c.org === "ottodot") return parseOttodotLabel(c.rawLabel);
    return c.classLabel || null;
  }

  // ---------------- state ----------------
  var db = null;
  var classes = [];      // loaded from db
  var seriesList = [];
  var classesLoaded = false, seriesLoaded = false, materialized = false;
  var currentTab = "dashboard";
  var addOrg = null;           // which org's add-form is showing
  var breakdownPeriod = "month"; // today | week | month
  var breakdownMonth = todayStr().slice(0,7); // which month the breakdown shows when period is "month"
  var historyOrgFilter = "all";
  var historyView = "calendar";    // list | calendar | synclog
  var calendarMonth = todayStr().slice(0,7);
  var calendarSelected = todayStr();
  var lastDeleted = null;      // {id, snapshot} for undo
  var toastTimer = null;
  var detailClassId = null;    // which class's detail modal is open
  var detailEditMode = false;  // is the detail modal showing the edit form
  var syncRuns = [];           // recent sync script runs, newest first
  var syncRunsLoaded = false;
  var customOrgs = [];         // user-added tuition centres, oldest first
  var customOrgsLoaded = false;
  var editingOrgId = null;     // which custom org is being edited in Settings
  var payments = {};           // "org_YYYY-MM" -> payment marker doc

  var mainEl = document.getElementById("main");
  var sectionLabelEl = document.getElementById("sectionLabel");

  // ---------------- db init ----------------
  async function initDb(){
    try{
      await firebase.auth().signInAnonymously();
    }catch(e){ console.error("auth failed", e); renderAll(); return; }
    db = firebase.firestore();

    db.collection("classes").onSnapshot(function(snap){
      classes = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      classesLoaded = true;
      maybeMaterialize();
      renderAll();
    }, function(err){ console.error("classes onSnapshot", err); });

    db.collection("series").onSnapshot(function(snap){
      seriesList = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      seriesLoaded = true;
      maybeMaterialize();
      renderAll();
    }, function(err){ console.error("series onSnapshot", err); });

    db.doc("settings/colors").onSnapshot(function(snap){
      var data = snap.exists ? snap.data() : {};
      orgColors = Object.assign({}, DEFAULT_ORG_COLORS, data);
      applyOrgColors();
      if (currentTab === "settings") renderSettings();
    }, function(err){ console.error("colors onSnapshot", err); });

    db.collection("syncRuns").orderBy("runAt","desc").limit(30).onSnapshot(function(snap){
      syncRuns = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      syncRunsLoaded = true;
      renderAll();
    }, function(err){ console.error("syncRuns onSnapshot", err); });

    db.collection("orgs").orderBy("createdAt","asc").onSnapshot(function(snap){
      customOrgs = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      customOrgsLoaded = true;
      maybeMaterialize();
      renderAll();
    }, function(err){ console.error("orgs onSnapshot", err); });

    db.collection("payments").onSnapshot(function(snap){
      payments = {};
      snap.docs.forEach(function(d){ payments[d.id] = d.data(); });
      renderAll();
    }, function(err){ console.error("payments onSnapshot", err); });
  }

  function activeClasses(){ return classes.filter(function(c){ return !c.deletedAt; }); }

  // ---------------- recurring materialization ----------------
  var materializing = false;
  var MATERIALIZE_HORIZON_DAYS = 365; // how far ahead manual recurring series get pre-generated
  function maybeMaterialize(){
    if (!classesLoaded || !seriesLoaded || !customOrgsLoaded || materializing || !db) return;
    materializing = true;
    var today = todayStr();
    var horizon = addDays(today, MATERIALIZE_HORIZON_DAYS);
    var existingKeys = {};
    classes.forEach(function(c){ if (c.seriesId) existingKeys[c.seriesId+"|"+c.date] = true; });

    var toCreate = [];
    seriesList.forEach(function(s){
      if (!s.active) return;
      var wIdx = WEEKDAY_NAMES.indexOf(s.weekday);
      if (wIdx < 0) return;
      // Always show at least a year of occurrences from the series' own
      // start date, even if that start is further out than today's rolling
      // window — otherwise a class scheduled to start months from now only
      // ever gets its single literal start date, with no visible "weekly"
      // pattern until today eventually catches up to it.
      var effectiveHorizon = addDays(s.startDate, MATERIALIZE_HORIZON_DAYS);
      if (horizon > effectiveHorizon) effectiveHorizon = horizon;
      var seriesHorizon = (s.endDate && s.endDate < effectiveHorizon) ? s.endDate : effectiveHorizon;
      var cursor = s.startDate;
      var cIdx = weekdayIdx(cursor);
      var diff = (wIdx - cIdx + 7) % 7;
      cursor = addDays(cursor, diff);
      while (cursor <= seriesHorizon){
        var key = s.id+"|"+cursor;
        if (!existingKeys[key]){
          toCreate.push(buildSeriesOccurrence(s, cursor));
        }
        cursor = addDays(cursor, 7);
      }
    });

    if (toCreate.length === 0){ materializing = false; return; }
    Promise.all(toCreate.map(function(doc){
      return db.collection("classes").doc(doc.seriesId+"_"+doc.date).set(doc);
    })).catch(function(e){ console.error("materialize failed", e); })
      .finally(function(){ materializing = false; });
  }

  function buildSeriesOccurrence(s, date){
    var computed = computeIncome(s.org, Object.assign({}, s, {date: date}));
    return {
      org: s.org,
      date: date,
      startTime: s.startTime,
      durationHours: s.durationHours,
      level: s.level || null,
      category: s.category || null,
      studentCount: s.studentCount || null,
      classLabel: s.classLabel || null,
      description: s.description || null,
      rate: computed.rate,
      income: computed.income,
      source: "manual-recurring",
      seriesId: s.id,
      deletedAt: null,
      createdAt: Date.now()
    };
  }

  // ---------------- income computation ----------------
  function computeIncome(org, fields){
    var dur = Number(fields.durationHours) || 0;
    var rate = 0;
    if (org === "mastermaths"){
      rate = MASTERMATHS_RATE;
    } else if (org === "bluetree"){
      rate = bluetreeRate(fields.category, Number(fields.studentCount)||1);
    } else if (org === "primeplus"){
      rate = PRIMEPLUS_RATES[fields.category] || 0;
    } else if (org === "ottodot"){
      rate = 35;
    } else if (org === "mindstretcher"){
      rate = mindstretcherRate(fields.level, isWeekendDate(fields.date || fields.startDate), fields.studentCount);
    } else {
      var custom = findCustomOrg(org);
      if (custom) rate = custom.rate;
    }
    return { rate: rate, income: Math.round(rate*dur*100)/100 };
  }

  // ---------------- writes ----------------
  async function saveOneOff(org, fields){
    if (!db) return;
    var computed = computeIncome(org, fields);
    var doc = Object.assign({
      org: org,
      source: "manual",
      seriesId: null,
      deletedAt: null,
      createdAt: Date.now(),
      rate: computed.rate,
      income: computed.income
    }, fields);
    await db.collection("classes").add(doc);
  }

  async function saveRecurring(org, fields){
    if (!db) return;
    var seriesDoc = {
      org: org,
      weekday: WEEKDAY_NAMES[weekdayIdx(fields.date)],
      startTime: fields.startTime,
      durationHours: fields.durationHours,
      level: fields.level || null,
      category: fields.category || null,
      studentCount: fields.studentCount || null,
      classLabel: fields.classLabel || null,
      description: fields.description || null,
      active: true,
      startDate: fields.date,
      endDate: fields.endDate || null,
      createdAt: Date.now()
    };
    var ref = await db.collection("series").add(seriesDoc);
    if (!seriesDoc.endDate || fields.date <= seriesDoc.endDate) {
      var occ = buildSeriesOccurrence(Object.assign({id:ref.id}, seriesDoc), fields.date);
      await db.collection("classes").doc(ref.id+"_"+fields.date).set(occ);
    }
  }

  function periodTotals(range, orgFilter){
    var today = todayStr();
    var earned = 0, projected = 0;
    activeClasses().forEach(function(c){
      if (c.date < range[0] || c.date > range[1]) return;
      if (orgFilter && orgFilter !== "all" && c.org !== orgFilter) return;
      if (c.date <= today) earned += c.income; else projected += c.income;
    });
    return { earned:earned, projected:projected, combined:earned+projected };
  }

  function orgBreakdown(range){
    var today = todayStr();
    var map = {};
    allOrgKeys().forEach(function(o){ map[o] = {earned:0, projected:0}; });
    activeClasses().forEach(function(c){
      if (c.date < range[0] || c.date > range[1]) return;
      if (!map[c.org]) map[c.org] = {earned:0, projected:0};
      if (c.date <= today) map[c.org].earned += c.income; else map[c.org].projected += c.income;
    });
    return map;
  }

  function timeToMinutes(t){
    var p = (t || "").split(":").map(Number);
    return p.length >= 2 && !isNaN(p[0]) ? p[0]*60 + p[1] : null;
  }

  // Next class that hasn't finished yet: today's still-running or later classes, then future days.
  // Classes that haven't finished yet, soonest first (today's running/later ones, then future days).
  function upcomingClasses(){
    var now = new Date();
    var today = toDateStr(now);
    var nowMin = now.getHours()*60 + now.getMinutes();
    var upcoming = activeClasses().filter(function(c){
      if (c.date > today) return true;
      if (c.date < today) return false;
      var start = timeToMinutes(c.startTime);
      if (start === null) return true;
      return start + (Number(c.durationHours)||0)*60 > nowMin;
    });
    upcoming.sort(function(a,b){
      if (a.date !== b.date) return a.date < b.date ? -1 : 1;
      var ta = timeToMinutes(a.startTime), tb = timeToMinutes(b.startTime);
      return (ta === null ? 1440 : ta) - (tb === null ? 1440 : tb);
    });
    return upcoming;
  }

  function findUpNext(){
    var now = new Date();
    var today = toDateStr(now);
    var nowMin = now.getHours()*60 + now.getMinutes();
    var upcoming = upcomingClasses();
    if (!upcoming.length) return null;
    var next = upcoming[0];
    var sameDay = upcoming.filter(function(c){ return c.date === next.date; }).length - 1;
    var start = timeToMinutes(next.startTime);
    var inProgress = next.date === today && start !== null && start <= nowMin;
    return { cls:next, moreThatDay:sameDay, inProgress:inProgress };
  }

  function upNextHtml(){
    var n = findUpNext();
    if (!n) return '<div class="upnext empty">No upcoming classes. Add one or sync to see what\'s next.</div>';
    var c = n.cls, today = todayStr();
    var when = c.date === today ? "Today" : c.date === addDays(today,1) ? "Tomorrow"
      : new Date(c.date+"T00:00:00").toLocaleDateString("en-SG",{weekday:"long", day:"numeric", month:"short"});
    var label = n.inProgress ? "Happening now" : "Up next · " + when;
    var meta = orgMeta(c.org);
    var bits = [];
    var type = classTypeLabel(c);
    if (type) bits.push(type);
    if (c.durationHours) bits.push(c.durationHours + " h");
    if (c.studentCount) bits.push(c.studentCount + (Number(c.studentCount)===1 ? " student" : " students"));
    bits.push(fmtMoney(c.income));
    return '<div class="upnext" data-detail="'+c.id+'">'+
      '<div class="u-label"><span>'+label+'</span>'+(n.moreThatDay>0 ? '<span>+'+n.moreThatDay+' more that day</span>' : '')+'</div>'+
      '<div class="u-title"><span class="u-dot"></span>'+(c.startTime ? formatTime12h(c.startTime)+' · ' : '')+meta.label+'</div>'+
      '<div class="u-sub mono">'+bits.join(" · ")+'</div>'+
    '</div>';
  }

  // ---- payments: one marker per centre per month ----
  function isPaid(org, ym){ var p = payments[org+"_"+ym]; return !!(p && p.paid); }

  async function setPaid(org, ym, paid, amount){
    if (!db) return;
    try{
      await db.collection("payments").doc(org+"_"+ym).set({ org:org, ym:ym, paid:paid, amount:amount, updatedAt:Date.now() }, {merge:true});
      showToast(orgMeta(org).label+" · "+monthLabelShort(ym)+(paid ? " marked paid" : " marked unpaid"));
    }catch(e){ console.error("setPaid", e); showToast("Couldn't save. Check your connection."); }
  }

  function monthLabelShort(ym){
    var p = ym.split("-").map(Number);
    return new Date(p[0], p[1]-1, 1).toLocaleDateString("en-SG",{month:"short", year:"numeric"});
  }

  // Finished months (before this one) with income that hasn't been marked paid, oldest first.
  function owedList(){
    var thisMonth = todayStr().slice(0,7);
    var map = {};
    activeClasses().forEach(function(c){
      if (!c.date || !c.income) return;
      var ym = c.date.slice(0,7);
      if (ym >= thisMonth) return;
      var key = c.org+"_"+ym;
      if (!map[key]) map[key] = { org:c.org, ym:ym, amount:0 };
      map[key].amount += c.income;
    });
    return Object.keys(map).map(function(k){ return map[k]; })
      .filter(function(o){ return o.amount > 0 && !isPaid(o.org, o.ym); })
      .sort(function(a,b){ return a.ym === b.ym ? (a.org < b.org ? -1 : 1) : (a.ym < b.ym ? -1 : 1); });
  }

  function monthTotalsList(fromYm, toYm){
    var months = [];
    for (var ym = fromYm; ym <= toYm; ym = shiftMonth(ym, 1)){
      months.push({ ym:ym, totals: periodTotals(monthRange(ym+"-01")) });
    }
    return months;
  }

  function trendColsHtml(months){
    var thisMonth = todayStr().slice(0,7);
    var max = Math.max.apply(null, months.map(function(m){ return m.totals.combined; })) || 1;
    return months.map(function(m){
      var t = m.totals;
      var pct = t.combined / max * 100;
      var parts = m.ym.split("-").map(Number);
      var label = new Date(parts[0], parts[1]-1, 1).toLocaleDateString("en-SG",{month:"short"});
      if (parts[1] === 1 || m === months[0]) label += " '"+String(parts[0]).slice(2);
      var short = t.combined >= 1000 ? "$"+(t.combined/1000).toFixed(1)+"k" : "$"+Math.round(t.combined);
      return '<button class="trend-col'+(m.ym===thisMonth?" sel":"")+'" data-trend="'+m.ym+'" title="'+fmtMoney(t.combined)+'">'+
        '<span class="trend-amt mono">'+short+'</span>'+
        '<span class="trend-bar" style="height:'+pct+'%">'+
          (t.projected > 0 ? '<i class="proj" style="flex:'+t.projected+'"></i>' : '')+
          (t.earned > 0 ? '<i class="earn" style="flex:'+t.earned+'"></i>' : '')+
        '</span>'+
        '<span class="trend-lbl">'+label+'</span>'+
      '</button>';
    }).join("");
  }

  function trendHtml(){
    var thisMonth = todayStr().slice(0,7);
    var months = monthTotalsList(shiftMonth(thisMonth, -5), thisMonth);
    while (months.length > 1 && months[0].totals.combined === 0) months.shift();
    return '<div class="card trend-card" id="trendCard" role="button" tabindex="0">'+
      '<h2 style="display:flex;justify-content:space-between;align-items:baseline;">Monthly income<span class="see-all">See all ›</span></h2>'+
      '<div class="trend">'+trendColsHtml(months)+'</div></div>';
  }

  // Full month-by-month history, from the first month with a class to the last (future months are projected).
  function openIncomeHistory(){
    var dates = activeClasses().map(function(c){ return c.date; }).filter(Boolean).sort();
    var thisMonth = todayStr().slice(0,7);
    var first = dates.length ? dates[0].slice(0,7) : thisMonth;
    var last = dates.length ? dates[dates.length-1].slice(0,7) : thisMonth;
    if (last < thisMonth) last = thisMonth;
    var months = monthTotalsList(first, last);
    var earned = 0, projected = 0;
    months.forEach(function(m){ earned += m.totals.earned; projected += m.totals.projected; });

    function monthRow(m){
      var parts = m.ym.split("-").map(Number);
      var label = new Date(parts[0], parts[1]-1, 1).toLocaleDateString("en-SG",{month:"long", year:"numeric"});
      var t = m.totals;
      return '<button class="ih-row'+(m.ym===thisMonth?" now":"")+'" data-trend="'+m.ym+'">'+
        '<span class="ih-month">'+label+(m.ym===thisMonth?' <span class="tag-badge">now</span>':'')+'</span>'+
        '<span class="ih-split mono">'+(t.earned ? fmtMoney(t.earned)+' earned' : '')+(t.earned && t.projected ? ' · ' : '')+(t.projected ? fmtMoney(t.projected)+' proj.' : '')+'</span>'+
        '<span class="ih-total mono">'+fmtMoney(t.combined)+'</span>'+
      '</button>';
    }
    var pastRows = months.filter(function(m){ return m.ym <= thisMonth; }).reverse().map(monthRow).join("");
    var futureRows = months.filter(function(m){ return m.ym > thisMonth; }).map(monthRow).join("");
    var rows = '<div class="ih-section">So far</div>'+pastRows+
      (futureRows ? '<div class="ih-section">Coming months</div>'+futureRows : '');

    var overlay = document.createElement("div");
    overlay.id = "incomeOverlay";
    overlay.className = "modal-overlay";
    overlay.innerHTML =
      '<div class="modal-card income-modal">'+
        '<div class="modal-head"><h3>Income by month</h3><button class="icon-btn" id="incomeCloseBtn" aria-label="Close">✕</button></div>'+
        '<div class="ih-summary"><div><span class="dot earned"></span> Earned so far <b class="mono">'+fmtMoney(earned)+'</b></div>'+
          '<div><span class="dot projected"></span> Still to come <b class="mono">'+fmtMoney(projected)+'</b></div></div>'+
        '<div class="ih-chart"><div class="trend" style="min-width:'+(months.length*46)+'px;height:170px;">'+trendColsHtml(months)+'</div></div>'+
        '<div class="ih-hint">Tap a month to see its breakdown.</div>'+
        '<div class="ih-list">'+rows+'</div>'+
      '</div>';
    document.body.appendChild(overlay);
    function close(){ overlay.remove(); }
    overlay.addEventListener("click", function(e){ if (e.target === overlay) close(); });
    document.getElementById("incomeCloseBtn").addEventListener("click", close);
    overlay.querySelectorAll("[data-trend]").forEach(function(btn){
      btn.addEventListener("click", function(){
        breakdownPeriod = "month"; breakdownMonth = btn.getAttribute("data-trend");
        close(); renderDashboard();
      });
    });
    var chart = overlay.querySelector(".ih-chart");
    var nowCol = chart.querySelector('[data-trend="'+thisMonth+'"]');
    if (nowCol) chart.scrollLeft = Math.max(0, nowCol.offsetLeft - chart.clientWidth*0.6);
  }

  function renderDashboard(){
    sectionLabelEl.textContent = "Dashboard";
    var today = todayStr();
    var todayRange = [today, today];
    var weekRange = [mondayOf(today), sundayOf(today)];
    var monthRangeArr = monthRange(today);

    var periods = [
      {key:"today", label:"Today", totals: periodTotals(todayRange)},
      {key:"week", label:"This Week", totals: periodTotals(weekRange)},
      {key:"month", label:"This Month", totals: periodTotals(monthRangeArr)}
    ];

    var cardsHtml = periods.map(function(p){
      return '<div class="period-card">'+
        '<div class="p-label">'+p.label+'</div>'+
        '<div class="p-combined display mono">'+fmtMoney(p.totals.combined)+'</div>'+
        '<div class="p-row"><span class="k"><span class="dot earned"></span>Earned</span><span class="mono">'+fmtMoney(p.totals.earned)+'</span></div>'+
        '<div class="p-row"><span class="k"><span class="dot projected"></span>Projected</span><span class="mono">'+fmtMoney(p.totals.projected)+'</span></div>'+
      '</div>';
    }).join("");

    var breakdownMonthRange = monthRange(breakdownMonth+"-01");
    var rangeForBreakdown = breakdownPeriod==="today" ? todayRange : breakdownPeriod==="week" ? weekRange : breakdownMonthRange;
    var bd = orgBreakdown(rangeForBreakdown);

    var monthNavHtml = "";
    if (breakdownPeriod === "month"){
      var ymParts = breakdownMonth.split("-").map(Number);
      var monthLabel = new Date(ymParts[0], ymParts[1]-1, 1).toLocaleDateString("en-SG",{month:"long", year:"numeric"});
      var bTotals = periodTotals(breakdownMonthRange);
      monthNavHtml =
        '<div class="cal-nav" style="margin-bottom:2px;">'+
          '<button class="icon-btn" id="bdPrev" aria-label="Previous month">‹</button>'+
          '<div class="cal-month display">'+monthLabel+'</div>'+
          '<button class="icon-btn" id="bdNext" aria-label="Next month">›</button>'+
        '</div>'+
        '<div class="cal-summary">Total <span class="mono">'+fmtMoney(bTotals.combined)+'</span> — '+fmtMoney(bTotals.earned)+' earned · '+fmtMoney(bTotals.projected)+' projected</div>';
    }
    var rowsHtml = allOrgKeys().map(function(org){
      var v = bd[org] || {earned:0, projected:0};
      var combined = v.earned + v.projected;
      if (combined === 0) return "";
      var meta = orgMeta(org);
      var payPill = "";
      if (breakdownPeriod === "month" && breakdownMonth < today.slice(0,7) && v.earned > 0){
        payPill = isPaid(org, breakdownMonth)
          ? '<button class="pay-pill paid" data-unpay="'+org+'|'+breakdownMonth+'|'+v.earned+'" title="Mark as unpaid">Paid ✓</button>'
          : '<button class="pay-pill" data-pay="'+org+'|'+breakdownMonth+'|'+v.earned+'" title="Mark as paid">Mark paid</button>';
      }
      return '<div class="breakdown-row">'+
        '<div class="org"><span class="dot" style="background:'+meta.color+'"></span>'+meta.label+payPill+'</div>'+
        '<div class="amounts"><div class="combined mono">'+fmtMoney(combined)+'</div>'+
          '<div class="split mono">'+fmtMoney(v.earned)+' earned · '+fmtMoney(v.projected)+' proj.</div></div>'+
      '</div>';
    }).join("");
    if (!rowsHtml) rowsHtml = '<div class="empty-note">No classes logged for this period yet.</div>';

    var bdTotal = 0;
    allOrgKeys().forEach(function(o){ var v = bd[o]; if (v) bdTotal += v.earned + v.projected; });
    var shareBarHtml = "";
    if (bdTotal > 0){
      shareBarHtml = '<div class="sharebar">'+allOrgKeys().map(function(o){
        var v = bd[o]; var amt = v ? v.earned + v.projected : 0;
        return amt > 0 ? '<i style="width:'+(amt/bdTotal*100)+'%;background:'+orgMeta(o).color+'"></i>' : "";
      }).join("")+'</div>';
    }

    mainEl.innerHTML = '<div class="dash">'+
      '<div class="dash-col col-a">'+
        upNextHtml()+
        '<div class="period-scroller">'+cardsHtml+'</div>'+
        comingUpHtml()+
      '</div>'+
      '<div class="dash-col col-b">'+
        '<div class="card bd-card">'+
          '<h2>Breakdown by organisation</h2>'+
          '<div class="seg" style="margin-bottom:12px;">'+
            segBtn("today","Today")+segBtn("week","Week")+segBtn("month","Month")+
          '</div>'+
          monthNavHtml+
          shareBarHtml+
          rowsHtml+
          owedFooterHtml()+
        '</div>'+
      '</div>'+
      '<div class="dash-col col-c">'+
        '<div class="card quick-card">'+
          '<h2>Quick add</h2>'+
          '<div class="quickgrid">'+
            quickBtn("mastermaths","Mastermaths")+
            quickBtn("bluetree","Bluetree")+
            quickBtn("primeplus","PrimePlus")+
            customOrgs.map(function(o){ return quickBtn(o.id, o.label); }).join("")+
          '</div>'+
        '</div>'+
        trendHtml()+
      '</div>'+
    '</div>';

    var upNextEl = mainEl.querySelector(".upnext[data-detail]");
    if (upNextEl) upNextEl.addEventListener("click", function(){ openDetail(upNextEl.getAttribute("data-detail")); });
    mainEl.querySelectorAll(".cu-row[data-detail]").forEach(function(row){
      row.addEventListener("click", function(){ openDetail(row.getAttribute("data-detail")); });
    });
    mainEl.querySelectorAll("[data-pay]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var p = btn.getAttribute("data-pay").split("|");
        setPaid(p[0], p[1], true, Number(p[2]));
      });
    });
    mainEl.querySelectorAll("[data-unpay]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var p = btn.getAttribute("data-unpay").split("|");
        setPaid(p[0], p[1], false, Number(p[2]));
      });
    });
    var owedMore = document.getElementById("owedMore");
    if (owedMore) owedMore.addEventListener("click", openOwedList);
    var trendCard = document.getElementById("trendCard");
    if (trendCard){
      trendCard.addEventListener("click", openIncomeHistory);
      trendCard.addEventListener("keydown", function(e){ if (e.key === "Enter" || e.key === " "){ e.preventDefault(); openIncomeHistory(); } });
    }
    mainEl.querySelectorAll("[data-quick]").forEach(function(btn){
      btn.addEventListener("click", function(){ addOrg = btn.getAttribute("data-quick"); setTab("add"); });
    });
    mainEl.querySelectorAll("[data-seg]").forEach(function(btn){
      btn.addEventListener("click", function(){ breakdownPeriod = btn.getAttribute("data-seg"); renderDashboard(); });
    });
    var bdPrev = document.getElementById("bdPrev"), bdNext = document.getElementById("bdNext");
    if (bdPrev) bdPrev.addEventListener("click", function(){ breakdownMonth = shiftMonth(breakdownMonth,-1); renderDashboard(); });
    if (bdNext) bdNext.addEventListener("click", function(){ breakdownMonth = shiftMonth(breakdownMonth,1); renderDashboard(); });
  }

          '<div class="quickgrid">'+
            quickBtn("mastermaths","Mastermaths")+
            quickBtn("bluetree","Bluetree")+
            quickBtn("primeplus","PrimePlus")+
            customOrgs.map(function(o){ return quickBtn(o.id, o.label); }).join("")+

        '<div class="field" id="endDateField" hidden><label>Ends on (optional)</label><input type="date" id="fEndDate"></div>'+
        '<div class="rate-preview"><span>Estimated pay</span><span class="mono" id="ratePreview">'+fmtMoney(0)+'</span></div>'+
        '<button class="save-btn" id="saveBtn">Save class</button>'+

      };

    document.getElementById("fDuration").addEventListener("input", updatePreview);

          updatePreview();
        });
      });

      mainEl.querySelectorAll("#catChoice button").forEach(function(btn){

          mainEl.querySelectorAll("#catChoice button").forEach(function(b){ b.classList.remove("active"); });
          btn.classList.add("active");
          catVal = btn.getAttribute("data-val");
          updatePreview();
        });
      });

    document.getElementById("fRecurring").addEventListener("click", function(){
      recurringOn = !recurringOn;
      this.classList.toggle("on", recurringOn);
      document.getElementById("endDateField").hidden = !recurringOn;
    });

    document.getElementById("saveBtn").addEventListener("click", async function(){

        date: document.getElementById("fDate").value,
        startTime: document.getElementById("fTime").value,
        durationHours: Number(document.getElementById("fDuration").value)||0,
        category: org==="bluetree" ? levelVal : catVal,
        studentCount: needsLevelChoice ? (Number(document.getElementById("studentCount").value)||1) : null,
        level: org==="mindstretcher" ? levelVal : null,
        classLabel: document.getElementById("fClassLabel").value.trim() || null,
        description: document.getElementById("fDescription").value.trim() || null,
        endDate: document.getElementById("fEndDate").value || null
      };
      this.disabled = true;
      this.textContent = "Saving…";
      try{
        if (recurringOn) await saveRecurring(org, fields);
        else await saveOneOff(org, fields);
        showToast("Class saved", false);
        addOrg = null;
        setTab("dashboard");
      }catch(e){
        console.error(e);
        this.disabled = false;
        this.textContent = "Save class";
        showToast("Couldn't save — try again", false);
      }
    });

    updatePreview();
  }

  // ---- Sync log ----
  var CHANGE_TYPE_LABELS = { added:"New", updated:"Updated", removed:"Removed", restored:"Restored" };
  function formatRunTime(ms){
    if (!ms) return "";
    var d = new Date(ms);
    return d.toLocaleDateString("en-SG",{day:"2-digit",month:"short"}) + ", " + d.toLocaleTimeString("en-SG",{hour:"numeric",minute:"2-digit"});
  }
  function changeLabel(run, ch){
    if (run.org === "ottodot") return (ch.rawLabel && parseOttodotLabel(ch.rawLabel)) || ch.rawLabel || "";
    return ch.classLabel || "";
  }
  function renderChangeRow(run, ch){
    var label = changeLabel(run, ch);
    var sub = fmtDate(ch.date) + (label ? " · " + label : "");
    var reasonHtml = ch.reason ? '<div class="sub-line mono" style="opacity:.75;">'+ch.reason+'</div>' : "";
    var amountText = ch.type === "updated" && ch.fromIncome != null
      ? fmtMoney(ch.fromIncome) + " → " + fmtMoney(ch.income||0)
      : fmtMoney(ch.income||0);
    return '<div class="class-item" style="cursor:default;">'+
      '<div class="left">'+
        '<div class="top-line"><span class="change-badge '+ch.type+'">'+(CHANGE_TYPE_LABELS[ch.type]||ch.type)+'</span></div>'+
        '<div class="sub-line mono">'+sub+'</div>'+
        reasonHtml+
      '</div>'+
      '<div class="right"><span class="income mono '+(ch.type==="removed"?"future":"past")+'">'+amountText+'</span></div>'+
    '</div>';
  }
  function renderSyncRunCard(run){
    var meta = orgMeta(run.org);
    var changes = run.changes || [];
    var counts = { added:0, updated:0, restored:0, removed:0 };
    changes.forEach(function(ch){ if (counts[ch.type] != null) counts[ch.type]++; });
    var summaryBits = [];
    if (run.written != null) summaryBits.push(run.written + " synced");
    if (counts.added) summaryBits.push(counts.added + " new");
    if (counts.updated) summaryBits.push(counts.updated + " updated");
    if (counts.restored) summaryBits.push(counts.restored + " restored");
    if (counts.removed) summaryBits.push(counts.removed + " removed");

    var changesHtml = changes.length
      ? '<div class="class-list">' + changes.map(function(ch){ return renderChangeRow(run, ch); }).join("") + '</div>'
      : '<div class="empty-note" style="padding:0;">No changes — everything already matched.</div>';

    return '<div class="sync-run-card">'+
      '<div class="sync-run-head">'+
        '<div class="org"><span class="dot" style="background:'+meta.color+'"></span>'+meta.label+'</div>'+
        '<div class="when mono">'+formatRunTime(run.runAt)+'</div>'+
      '</div>'+
      '<div class="sync-run-summary">'+(summaryBits.join(" · ")||"no changes")+'</div>'+
      changesHtml+
    '</div>';
  }
  function renderSyncLogHtml(){
    var list = syncRuns;
    if (historyOrgFilter !== "all") list = list.filter(function(r){ return r.org===historyOrgFilter; });
    if (!syncRunsLoaded) return '<div class="empty-note">Loading…</div>';
    if (!list.length) return '<div class="empty-note">No syncs recorded yet. Run "Sync to Ledger" from the Mind Stretcher or Ottodot tab and it\'ll show up here.</div>';
    return '<div style="display:flex;flex-direction:column;gap:12px;">' + list.map(renderSyncRunCard).join("") + '</div>';
  }

  function shiftMonth(ym, delta){
    var parts = ym.split("-").map(Number);
    var d = new Date(parts[0], parts[1]-1+delta, 1);
    return d.getFullYear()+"-"+pad(d.getMonth()+1);
  }
  function monthMatrix(ym){
    var parts = ym.split("-").map(Number);
    var year=parts[0], month=parts[1];
    var firstDateStr = year+"-"+pad(month)+"-01";
    var firstWeekday = weekdayIdx(firstDateStr);
    var daysInMonth = new Date(year, month, 0).getDate();
    var cells = [];
    for (var i=0;i<firstWeekday;i++) cells.push(null);
    for (var d=1; d<=daysInMonth; d++) cells.push(year+"-"+pad(month)+"-"+pad(d));
    while (cells.length % 7 !== 0) cells.push(null);
    var weeks = [];
    for (var w=0; w<cells.length; w+=7) weeks.push(cells.slice(w,w+7));
    return weeks;
  }

  function renderCalendarHtml(){
    var weeks = monthMatrix(calendarMonth);
    var ymParts = calendarMonth.split("-").map(Number);
    var monthLabel = new Date(ymParts[0], ymParts[1]-1, 1).toLocaleDateString("en-SG",{month:"long", year:"numeric"});
    var today = todayStr();

    var byDate = {};
    activeClasses().forEach(function(c){
      if (historyOrgFilter!=="all" && c.org!==historyOrgFilter) return;
      if (!byDate[c.date]) byDate[c.date] = [];
      byDate[c.date].push(c);
    });
    Object.keys(byDate).forEach(function(d){ byDate[d].sort(function(a,b){ return (a.startTime||"").localeCompare(b.startTime||""); }); });

    var headerRow = '<div class="cal-week cal-head">' + WEEKDAY_LABELS.map(function(l){ return '<div class="cal-wd">'+l+'</div>'; }).join('') + '</div>';

    var cellsHtml = weeks.map(function(week){
      return '<div class="cal-week">' + week.map(function(dateStr){
        if (!dateStr) return '<div class="cal-cell empty"></div>';
        var dayList = byDate[dateStr] || [];
        var chips = dayList.slice(0,3).map(function(c){
          var meta = orgMeta(c.org);
          return '<span class="cal-chip" data-detailchip="'+c.id+'" style="background:'+meta.color+'">'+formatTime12h(c.startTime)+'</span>';
        }).join("");
        var more = dayList.length>3 ? '<span class="cal-chip-more">+'+(dayList.length-3)+' more</span>' : "";
        var cls = "cal-cell" + (dateStr===today?" is-today":"") + (dateStr===calendarSelected?" is-selected":"");
        var dayNum = Number(dateStr.split("-")[2]);
        return '<button class="'+cls+'" data-date="'+dateStr+'"><span class="cal-daynum">'+dayNum+'</span><div class="cal-chips">'+chips+more+'</div></button>';
      }).join("") + '</div>';
    }).join("");

    var monthR = monthRange(calendarMonth+"-01");
    var mTotals = periodTotals(monthR, historyOrgFilter);

    var panelHtml = "";
    if (calendarSelected && calendarSelected.slice(0,7)===calendarMonth){
      var dayClasses = activeClasses().filter(function(c){
        return c.date===calendarSelected && (historyOrgFilter==="all"||c.org===historyOrgFilter);
      });
      panelHtml = '<div class="cal-daypanel"><h3 class="display">'+fmtDate(calendarSelected)+'</h3>' +
        (dayClasses.length ? '<div class="class-list">'+dayClasses.map(renderClassItem).join("")+'</div>' : '<div class="empty-note">No classes this day.</div>') +
      '</div>';
    }

    return '<div class="card">' +
      '<div class="cal-nav">' +
        '<button class="icon-btn" id="calPrev">‹</button>' +
        '<div class="cal-month display">'+monthLabel+'</div>' +
        '<button class="icon-btn" id="calNext">›</button>' +
      '</div>' +
      '<div class="cal-summary">'+(historyOrgFilter==="all" ? "Month combined" : orgMeta(historyOrgFilter).label+" this month")+' <span class="mono">'+fmtMoney(mTotals.combined)+'</span> — '+fmtMoney(mTotals.earned)+' earned · '+fmtMoney(mTotals.projected)+' projected</div>' +
      '<div class="cal-grid">'+headerRow+cellsHtml+'</div>' +
      panelHtml +
    '</div>';
  }

  function renderClassItem(c){
    var today = todayStr();
    var isFuture = c.date > today;
    var meta = orgMeta(c.org);
    var subBits = [];
    var typeLabel = classTypeLabel(c);
    if (typeLabel) subBits.push(typeLabel);
    if (c.category) subBits.push(PRIMEPLUS_LABELS[c.category] || c.category);
    if (c.studentCount) subBits.push(c.studentCount + " students");
    if (c.startTime) subBits.push(formatTime12h(c.startTime));
    var seriesBtn = c.seriesId ? '<button class="icon-btn" title="Stop repeating" data-stop="'+c.seriesId+'">⟲</button>' : "";
    return '<div class="class-item" data-detail="'+c.id+'">'+
      '<div class="left">'+
        '<div class="top-line"><span class="dot" style="background:'+meta.color+'"></span>'+meta.label+
          (c.source && c.source.indexOf("synced")===0 ? '<span class="tag-badge">synced</span>' : (c.seriesId?'<span class="tag-badge">weekly</span>':''))+
        '</div>'+
        '<div class="sub-line mono">'+fmtDate(c.date)+' · '+subBits.join(" · ")+'</div>'+
      '</div>'+
      '<div class="right">'+
        '<span class="income mono '+(isFuture?"future":"past")+'">'+fmtMoney(c.income)+'</span>'+
        seriesBtn+
        '<button class="icon-btn danger" title="Delete" data-del="'+c.id+'">✕</button>'+
      '</div>'+
    '</div>';
  }

  // ---- Class detail modal ----
  var SOURCE_LABELS = {
    "synced-mindstretcher": "Synced (Mind Stretcher)",
    "synced-ottodot": "Synced (Ottodot)",
    "manual": "Manual entry",
    "manual-recurring": "Manual entry (weekly)"
  };
  function detailRows(c){
    var rows = [];
    var meta = orgMeta(c.org);
    rows.push(["Organisation", meta.label]);
    rows.push(["Date", fmtDate(c.date)]);
    if (c.startTime) rows.push(["Start time", formatTime12h(c.startTime)]);
    if (c.durationHours) rows.push(["Duration", c.durationHours + " hr" + (Number(c.durationHours)===1?"":"s")]);
    var typeLabel = classTypeLabel(c);
    if (typeLabel) rows.push(["Class / level", typeLabel]);
    if (c.category) rows.push(["Category", PRIMEPLUS_LABELS[c.category] || c.category]);
    if (c.studentCount != null) rows.push(["Students", c.studentCount]);
    if (c.weekdayOrWeekend) rows.push(["Day type", c.weekdayOrWeekend]);
    rows.push(["Hourly rate", c.rate != null ? fmtMoney(c.rate) + "/hr" : "—"]);
    rows.push(["Income", fmtMoney(c.income)]);
    if (c.description) rows.push(["Notes", c.description]);
    if (c.source) rows.push(["Source", SOURCE_LABELS[c.source] || c.source]);
    return rows;
  }
  function openDetail(classId){ detailClassId = classId; detailEditMode = false; renderDetailModal(); }
  function closeDetail(){ detailClassId = null; detailEditMode = false; renderDetailModal(); }
  function attrEscape(s){ return String(s||"").replace(/"/g,"&quot;"); }

  function editFormHtml(c, meta){
    var org = c.org;
    var isOttodot = org === "ottodot";
    var labelValue = isOttodot ? (c.rawLabel||"") : (c.classLabel||"");

    var extraFieldsHtml = "";
    if (org === "bluetree"){
      extraFieldsHtml =
        '<div class="field"><label>Level</label><div class="choice-row" id="editLevelChoice">'+
          '<button data-val="primary" class="'+(c.category!=="secondary"?"active":"")+'">Primary</button>'+
          '<button data-val="secondary" class="'+(c.category==="secondary"?"active":"")+'">Secondary</button>'+
        '</div></div>'+
        '<div class="field"><label>Number of students</label><input type="number" id="editStudentCount" min="1" step="1" value="'+(c.studentCount||1)+'"></div>';
    } else if (org === "primeplus"){
      extraFieldsHtml =
        '<div class="field"><label>Category</label><div class="choice-row" id="editCatChoice">'+
          ["1-1","pri","sec"].map(function(k){
            var isActive = c.category ? c.category===k : k==="1-1";
            return '<button data-val="'+k+'" class="'+(isActive?"active":"")+'">'+PRIMEPLUS_LABELS[k]+'</button>';
          }).join("")+
        '</div></div>';
    } else if (org === "mindstretcher"){
      extraFieldsHtml =
        '<div class="field"><label>Level</label><div class="choice-row" id="editLevelChoice">'+
          MINDSTRETCHER_LEVELS.map(function(l){ return '<button data-val="'+l.key+'" class="'+(c.level===l.key?"active":"")+'">'+l.label+'</button>'; }).join("")+
        '</div></div>'+
        '<div class="field"><label>Number of students</label><input type="number" id="editStudentCount" min="1" step="1" value="'+(c.studentCount||1)+'"></div>';
    }

    return '<div class="modal-card">'+
      '<div class="modal-head"><span class="dot" style="background:'+meta.color+'"></span><h3>Edit — '+meta.label+'</h3>'+
        '<button class="icon-btn" id="editCloseBtn" aria-label="Close">✕</button>'+
      '</div>'+
      '<div class="field"><label>Date</label><input type="date" id="editDate" value="'+c.date+'"></div>'+
      '<div class="field"><label>Start time</label><input type="time" id="editTime" value="'+attrEscape(c.startTime||"")+'"></div>'+
      '<div class="field"><label>Duration (hours)</label><input type="number" id="editDuration" min="0.25" step="0.25" value="'+(c.durationHours||1)+'"></div>'+
      '<div class="field"><label>Class / level (optional)</label><input type="text" id="editClassLabel" value="'+attrEscape(labelValue)+'"></div>'+
      '<div class="field"><label>Description / notes (optional)</label><input type="text" id="editDescription" value="'+attrEscape(c.description||"")+'"></div>'+
      extraFieldsHtml+
      '<div class="rate-preview"><span>Estimated pay</span><span class="mono" id="editRatePreview">'+fmtMoney(c.income||0)+'</span></div>'+
      '<div class="modal-actions"><button class="icon-btn" id="editCancelBtn">Cancel</button><button class="icon-btn" id="editSaveBtn">Save changes</button></div>'+
    '</div>';
  }

  function wireEditForm(c){
    var org = c.org;
    var needsLevelChoice = org === "bluetree" || org === "mindstretcher";
    document.getElementById("editCloseBtn").addEventListener("click", closeDetail);
    document.getElementById("editCancelBtn").addEventListener("click", function(){ detailEditMode = false; renderDetailModal(); });

    var levelVal = org==="mindstretcher" ? (c.level || MINDSTRETCHER_LEVELS[0].key) : (c.category==="secondary" ? "secondary" : "primary");
    var catVal = org==="primeplus" ? (c.category || "1-1") : null;

    function currentFields(){
      return {
        date: document.getElementById("editDate").value,
        durationHours: Number(document.getElementById("editDuration").value)||0,
        category: org==="bluetree" ? levelVal : catVal,
        studentCount: needsLevelChoice ? (Number(document.getElementById("editStudentCount").value)||1) : null,
        level: org==="mindstretcher" ? levelVal : null
      };
    }
    function updateEditPreview(){
      var comp = computeIncome(org, currentFields());
      document.getElementById("editRatePreview").textContent = fmtMoney(comp.income) + "  ("+fmtMoney(comp.rate)+"/h)";
    }

    document.getElementById("editDuration").addEventListener("input", updateEditPreview);
    document.getElementById("editDate").addEventListener("input", updateEditPreview);
    if (needsLevelChoice){
      document.getElementById("editStudentCount").addEventListener("input", updateEditPreview);
      document.querySelectorAll("#editLevelChoice button").forEach(function(btn){
        btn.addEventListener("click", function(){
          document.querySelectorAll("#editLevelChoice button").forEach(function(b){ b.classList.remove("active"); });
          btn.classList.add("active");
          levelVal = btn.getAttribute("data-val");
          updateEditPreview();
        });
      });
    }
    if (org === "primeplus"){
      document.querySelectorAll("#editCatChoice button").forEach(function(btn){
        btn.addEventListener("click", function(){
          document.querySelectorAll("#editCatChoice button").forEach(function(b){ b.classList.remove("active"); });
          btn.classList.add("active");
          catVal = btn.getAttribute("data-val");
          updateEditPreview();
        });
      });
    }

    updateEditPreview();

    document.getElementById("editSaveBtn").addEventListener("click", async function(){
      var fields = currentFields();
      var labelVal = document.getElementById("editClassLabel").value.trim() || null;
      var descVal = document.getElementById("editDescription").value.trim() || null;
      var startTimeVal = document.getElementById("editTime").value || null;
      var computed = computeIncome(org, fields);

      var updateDoc = {
        date: fields.date,
        startTime: startTimeVal,
        durationHours: fields.durationHours,
        category: fields.category,
        studentCount: fields.studentCount,
        level: fields.level,
        description: descVal,
        rate: computed.rate,
        income: computed.income
      };
      if (org === "ottodot") updateDoc.rawLabel = labelVal;
      else updateDoc.classLabel = labelVal;

      this.disabled = true;
      this.textContent = "Saving…";
      try{
        await db.collection("classes").doc(c.id).update(updateDoc);
        showToast("Class updated", false);
        detailEditMode = false;
        renderDetailModal();
      }catch(e){
        console.error(e);
        this.disabled = false;
        this.textContent = "Save changes";
        showToast("Couldn't save — try again", false);
      }
    });
  }

  function renderDetailModal(){
    var existing = document.getElementById("detailOverlay");
    if (existing) existing.remove();
    if (!detailClassId) return;
    var c = classes.find(function(cc){ return cc.id===detailClassId; });
    if (!c){ detailClassId = null; return; }
    var meta = orgMeta(c.org);
    var overlay = document.createElement("div");
    overlay.id = "detailOverlay";
    overlay.className = "modal-overlay";

    if (detailEditMode){
      overlay.innerHTML = editFormHtml(c, meta);
      document.body.appendChild(overlay);
      overlay.addEventListener("click", function(e){ if (e.target === overlay) closeDetail(); });
      wireEditForm(c);
      return;
    }

    var rowsHtml = detailRows(c).map(function(r){
      return '<div class="detail-row"><span class="k">'+r[0]+'</span><span class="v mono">'+r[1]+'</span></div>';
    }).join("");
    overlay.innerHTML =
      '<div class="modal-card">'+
        '<div class="modal-head"><span class="dot" style="background:'+meta.color+'"></span><h3>'+meta.label+'</h3>'+
          '<button class="icon-btn" id="detailCloseBtn" aria-label="Close">✕</button>'+
        '</div>'+
        rowsHtml+
        '<div class="modal-actions"><button class="icon-btn" id="detailEditBtn">Edit</button><button class="icon-btn danger" id="detailDeleteBtn">Delete class</button></div>'+
      '</div>';
    document.body.appendChild(overlay);
    overlay.addEventListener("click", function(e){ if (e.target === overlay) closeDetail(); });
    document.getElementById("detailCloseBtn").addEventListener("click", closeDetail);
    document.getElementById("detailEditBtn").addEventListener("click", function(){ detailEditMode = true; renderDetailModal(); });
    document.getElementById("detailDeleteBtn").addEventListener("click", function(){
      softDelete(c.id);
      closeDetail();
    });
  }

  // ---- Trash ----
  function renderTrash(){
    sectionLabelEl.textContent = "Trash";
    var list = classes.filter(function(c){ return c.deletedAt; }).sort(function(a,b){ return b.deletedAt - a.deletedAt; });
    var itemsHtml = list.map(function(c){
      var meta = orgMeta(c.org);
      return '<div class="class-item">'+
        '<div class="left">'+
          '<div class="top-line"><span class="dot" style="background:'+meta.color+'"></span>'+meta.label+'</div>'+
          '<div class="sub-line mono">'+fmtDate(c.date)+' · '+fmtMoney(c.income)+'</div>'+
        '</div>'+
        '<div class="right"><button class="restore-btn" data-restore="'+c.id+'">Restore</button></div>'+
      '</div>';
    }).join("") || '<div class="empty-note">Nothing in the trash.</div>';

    mainEl.innerHTML = '<div class="class-list">'+itemsHtml+'</div>';
    mainEl.querySelectorAll("[data-restore]").forEach(function(btn){
      btn.addEventListener("click", function(){ restore(btn.getAttribute("data-restore")); });
    });

    // lazily purge anything older than 30 days
    var cutoff = Date.now() - 30*24*60*60*1000;
    classes.filter(function(c){ return c.deletedAt && c.deletedAt < cutoff; }).forEach(function(c){
      if (db) db.collection("classes").doc(c.id).delete();
    });
  }

  function setTab(tab){
    closeDetail();
    currentTab = tab;
    document.querySelectorAll("nav.tabbar button").forEach(function(b){
      b.classList.toggle("active", b.getAttribute("data-tab")===tab);
    });
    renderAll();
  }
  document.querySelectorAll("nav.tabbar button").forEach(function(b){
    b.addEventListener("click", function(){
      if (b.getAttribute("data-tab") !== "add") addOrg = null;
      setTab(b.getAttribute("data-tab"));
    });
  });

  renderAll();
})();
</script>
</body>
